name: Threads テスト投稿

# 手動実行のみ（Actions の画面、または gh workflow run threads-test.yml）
on:
  workflow_dispatch:
    inputs:
      text:
        description: '投稿する文章'
        required: false
        default: 'テスト投稿です'
      dry_run:
        description: '確認だけして投稿しない（トークンとアカウントの確認）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Threads に投稿する
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEXT: ${{ inputs.text }}
        run: node scripts/threads-test.js "$TEXT"
