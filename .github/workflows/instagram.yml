name: Instagram 自動投稿

on:
  schedule:
    # 予備の定時起動：毎朝 5:20（日本時間）。本命は外部サービスから 5:00 に workflow_dispatch で起動する
    # 何回起動しても、予定表の今日の投稿が投稿済みなら何もしない
    - cron: '20 20 * * *'
    # 18時の枠（栄養枠などのイレギュラー発信）：18:00 と、予備の 18:40（日本時間）
    # GitHub の定時起動は遅れることがあるため、外部サービスからも 18:00 に slot=evening で起動するとよい
    - cron: '0 9 * * *'
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿する枠（morning＝朝5時の枠、evening＝18時の枠。外部サービスからの朝の起動は空欄のままでよい）'
        type: choice
        options: [morning, evening]
        default: morning
      folder:
        description: '投稿するフォルダ名（空欄なら予定表の今日の1件）例: 2026-09-28-hiza-taisou'
        required: false
        default: ''
      dry_run:
        description: '確認だけして投稿しない'
        type: boolean
        default: false
      date:
        description: '確認モードのときだけ：この日（YYYY-MM-DD）の予定を確認する。空欄なら今日'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  # 投稿のあとに「投稿予定表の更新」を起動するのに使う
  actions: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 枠：手動・外部サービスの起動は slot の入力（空欄なら morning）、GitHub の定時起動は 9時台（UTC）の cron なら evening
      SLOT: ${{ inputs.slot || (startsWith(github.event.schedule, '20 20') && 'morning') || (github.event.schedule && 'evening') || 'morning' }}
    steps:
      # 起動したときのコミットではなく、main の最新を取る
      # （前の実行がまだ動いている間に起動した場合でも、その実行の投稿記録を見て二重投稿しないように）
      # 画像を最後にコミットした SHA を調べるため、履歴もすべて取る
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: 投稿する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DATE: ${{ inputs.date }}
          FOLDER: ${{ inputs.folder }}
          # リール動画を gh-pages に置いたあと、Pages の反映が始まったか確かめる（始まらないときだけ再構築を頼む）のに使う
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish.js "$FOLDER"
      - name: 投稿済みの記録を保存する
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/*/posted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "記録の変更なし"; else git commit -m "投稿済みの記録を追加" && git pull --rebase && git push; fi
      # ここから Threads。Instagram の投稿と記録が終わったあとに動かし、失敗してもワークフローは失敗にしない
      - name: Threads に連投する
        if: always()
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DATE: ${{ inputs.date }}
          FOLDER: ${{ inputs.folder }}
        run: node scripts/threads-auto.js $FOLDER
      - name: Threads の記録を保存する
        if: always() && !inputs.dry_run
        continue-on-error: true
        run: |
          git add posts/*/threads.json posts/*/threads-posted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "記録の変更なし"; else git commit -m "Threads 投稿済みの記録を追加" && git pull --rebase && git push; fi
      # ここから YouTube ショート。Threads のあとに、同じ実行でリール用に作った mp4 をそのままアップロードする
      # 失敗してもワークフローは失敗にしない（ログと posted.json の youtubeError に残す）
      # リールが投稿済みで動画をまだ作っていない実行（YouTube だけ出すとき）のために、ffmpeg を先に入れておく
      # （YouTube のステップの5分に、用意の時間を含めないため）
      - name: ffmpeg を用意する
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        # GitHub Releases の静的ビルドを使う（apt-get は遅いことがあるため。失敗したときだけ apt-get）
        run: node -e "require('./scripts/reel').ensureFfmpeg()"
      - name: YouTube ショートにアップロードする
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 公開設定。Settings → Variables の YT_PRIVACY（private / unlisted / public）。なければ private
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          YT_OUT_DIR: ${{ runner.temp }}/youtube
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DATE: ${{ inputs.date }}
          FOLDER: ${{ inputs.folder }}
        run: node scripts/youtube.js $FOLDER
      - name: YouTube の記録を保存する
        if: always() && !inputs.dry_run
        continue-on-error: true
        run: |
          git add posts/*/posted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "記録の変更なし"; else git commit -m "YouTube 投稿済みの記録を追加" && git pull --rebase && git push; fi
      # 審査が通るまでの手動投稿用：その日の mp4・タイトル・説明文を成果物（Artifacts）に置く
      - name: YouTube 用の動画と文章を成果物に置く
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: youtube-shorts
          path: ${{ runner.temp }}/youtube
          if-no-files-found: ignore
          retention-days: 14
      # 予定表（schedule.json）とアプリ用データ（app-feed/feed.json）の書き換えは「投稿予定表の更新」だけが行う
      # （投稿の記録が増えたときと、アプリ用データの日付を1日進めるため、毎回起動する）
      - name: 投稿予定表の更新を起動する
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run schedule.yml --ref main
